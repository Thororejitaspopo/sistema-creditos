<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA ALPHA V6 - Comando Móvil</title>
    
    <style>
        /* 1. MAGIA DE CENTRADO ABSOLUTO */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1120; /* El fondo oscuro elegante */
            font-family: Arial, sans-serif;
            color: white;
            /* ESTO CENTRA TODO EL BLOQUE EN MEDIO DEL CELULAR */
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            min-height: 100vh;
        }


        /* 2. EL CONTENEDOR LIMITADO (Para que no se estire feo) */
        .contenedor-menu-movil {
            width: 100%;
            max-width: 380px; /* Medida perfecta para pantallas de celular */
            padding: 30px 20px 50px 20px; 
            box-sizing: border-box;
        }

        .titulo-sistema {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-transform: uppercase;
            color: #ffffff;
        }

        /* 3. DISEÑO DE LOS BOTONES (IGUAL A SU IMAGEN) */
        .item-menu {
            display: flex;
            align-items: center;
            padding: 15px 18px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 15px;
            background-color: transparent;
            transition: 0.3s;
        }

        .item-menu:active {
            background-color: #1e293b;
        }

        /* Botón Activo (Inicio) */
        .item-menu.activo {
            background-color: #1e293b;
            color: #38bdf8;
            border-left: 4px solid #38bdf8;
            padding-left: 14px;
        }

        /* Botón Consultar Matriz (Centrado por dentro también) */
        .item-menu.btn-matriz {
            border: 1px solid #0284c7;
            color: white;
            font-weight: bold;
            margin-bottom: 25px;
            justify-content: center; /* Centra el texto y el icono internamente */
        }
        .item-menu.btn-matriz .icono {
            margin-right: 10px;
        }

        .icono {
            margin-right: 15px;
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        /* 4. TÍTULOS DE CATEGORÍAS */
        .titulo-categoria {
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 30px;
            margin-bottom: 12px;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <div class="contenedor-menu-movil">
        
        <div class="titulo-sistema">SISTEMA ALPHA V6</div>

        <!-- INICIO -->
        <div class="item-menu activo" onclick="abrirModulo('inicio')">
            <span class="icono">🏠</span> Inicio
        </div>

        <!-- CONSULTAR MATRIZ -->
        <div class="item-menu btn-matriz" onclick="abrirModulo('matriz')">
            <span class="icono">🔍⚡</span> CONSULTAR MATRIZ
        </div>

        <!-- OPERACIONES -->
        <div class="titulo-categoria">📊 OPERACIONES</div>
        <div class="item-menu" onclick="abrirModulo('clientes')">
            <span class="icono">👥</span> Registrar Clientes
        </div>
        <div class="item-menu" onclick="abrirModulo('credito')">
            <span class="icono">💳</span> Crear Crédito
        </div>
        <div class="item-menu" onclick="abrirModulo('pago')">
            <span class="icono">📄</span> Registrar Pago
        </div>
        <div class="item-menu" onclick="abrirModulo('gastos')">
            <span class="icono">💸</span> Gastos Varios
        </div>

        <!-- CAJA Y CONTABILIDAD -->
        <div class="titulo-categoria">💰 CAJA Y CONTABILIDAD</div>
        <div class="item-menu" onclick="abrirModulo('capital')">
            <span class="icono">🏛️</span> Módulo Capital
        </div>
        <div class="item-menu" onclick="abrirModulo('interes')">
            <span class="icono">📈</span> Módulo Interés
        </div>
        <div class="item-menu" onclick="abrirModulo('cierre')">
            <span class="icono">🔒</span> Cierre de Caja
        </div>

        <!-- PERSONAL Y AUDITORÍA -->
        <div class="titulo-categoria">👔 PERSONAL Y AUDITORÍA</div>
        <div class="item-menu" onclick="abrirModulo('supervisores')">
            <span class="icono">👔</span> Supervisores
        </div>
        <div class="item-menu" onclick="abrirModulo('cobradores')">
            <span class="icono">🏍️</span> Cobradores
        </div>
        <div class="item-menu" onclick="abrirModulo('reportes')">
            <span class="icono">📋</span> Reportes Generales
        </div>
        <div class="item-menu" onclick="abrirModulo('mora')">
            <span class="icono">⚖️</span> Gestión y Mora
        </div>

    </div>
<!-- 🚀 CONEXIÓN A LA BASE DE DATOS SUPABASE 🚀 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 🔒 MOTOR PRINCIPAL Y GUARDIA DE SEGURIDAD -->
<script src="app.js"></script>
</body>
</html>
